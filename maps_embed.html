*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f6f8;color:#222}
.wrap{max-width:1500px;margin:0 auto;padding:10px 12px 30px}
h1{font-size:22px;margin:6px 0 4px;color:#2c3e50}
.muted{color:#555;font-size:14px;margin:4px 0 8px;line-height:1.45}
a{color:#1d5fa8}
.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.cmp-bar{position:sticky;top:0;z-index:5;background:#f4f6f8;padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #dde2e8}
.cmp-bar button,.cmp-ctl button,.cmp-pick select,.cmp-pick button{font:inherit;font-size:14px;border:1px solid #c3cad3;background:#fff;border-radius:6px;padding:5px 10px;min-height:34px;color:#222}
.cmp-bar button.on{background:#1d3557;color:#fff;border-color:#1d3557}
.cmp-time{font-size:15px;margin-left:auto}
.cmp-grid{display:grid;gap:10px;margin-top:8px}
.cmp-grid[data-cols="1"]{grid-template-columns:1fr;max-width:1000px}
.cmp-grid[data-cols="2"]{grid-template-columns:1fr}
.cmp-grid[data-cols="4"]{grid-template-columns:1fr 1fr}
@media (min-width:760px),(orientation:landscape) and (min-width:560px){.cmp-grid[data-cols="2"]{grid-template-columns:1fr 1fr}}
@media (max-width:520px) and (orientation:portrait){.cmp-grid[data-cols="4"]{grid-template-columns:1fr}}
.cmp-cell[hidden]{display:none}
.cmp-cell{background:#fff;border:1px solid #dde2e8;border-radius:8px;padding:6px;min-width:0}
.cmp-ctl{display:flex;gap:6px;align-items:center}
.cmp-range{flex:1;min-width:60px;height:30px;accent-color:#1d3557}
.cmp-pick{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.cmp-pick select{max-width:100%}
.cmp-lead{color:#555;font-size:13px}
.cmp-slot{position:relative;width:100%;aspect-ratio:var(--ar,1.03);margin:0 auto;background:#eef2f5;border-radius:4px;overflow:hidden;touch-action:manipulation}
.cmp-slot img{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.cmp-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#777;padding:10px}
.cmp-badge{position:absolute;right:6px;bottom:6px;z-index:2;background:rgba(255,255,255,.9);border:1px solid #c3cad3;border-radius:4px;font-size:12px;padding:2px 6px;color:#333;pointer-events:none}
.cmp-badge[hidden]{display:none}
.cmp-tip{position:absolute;z-index:3;pointer-events:none;background:rgba(17,24,39,.9);color:#fff;font-size:13px;line-height:1.3;padding:4px 7px;border-radius:5px;white-space:nowrap;transform:translate(10px,-110%)}
.cmp-tip[hidden]{display:none}
.cmp-dot{position:absolute;z-index:2;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid #111;border-radius:50%;background:#fff;pointer-events:none}
.cmp-dot[hidden]{display:none}
.cmp-legend{display:block;max-width:100%;margin:4px auto 0}
.blinking .cmp-cell[data-side="a"] .cmp-slot{outline:3px solid #e76f51}
@media (min-width:760px){.cmp-grid[data-cols="4"] .cmp-slot{width:min(100%,calc((50vh - 120px) * var(--ar,1.03)))}
.cmp-grid[data-cols="2"] .cmp-slot{width:min(100%,calc((100vh - 230px) * var(--ar,1.03)))}}
body.embed{background:#fff}
body.embed .wrap{padding:0 2px 4px}
body.embed .cmp-grid[data-cols="2"] .cmp-slot{width:100%}
details.runs{margin-top:14px;background:#fff;border:1px solid #dde2e8;border-radius:8px;padding:8px 12px}
details.runs summary{cursor:pointer;font-weight:600}
table.runs{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
table.runs td,table.runs th{border-bottom:1px solid #e3e6ea;padding:5px 6px;text-align:left;vertical-align:top}
table.runs th{background:#3498db;color:#fff}

.theme-toggle{position:fixed;top:10px;right:12px;z-index:50;font:inherit;font-size:13px;padding:5px 12px;

html[data-theme="dark"] table.runs th{background:#23507a}

html:not([data-theme="light"]){color-scheme:dark}

/* Frame swap without a blank (from the Salish Sea site): reuse the <img>, decode the next
   frame before assigning it, and let only the newest request win. */
window.paintFrame = function (slot, url, alt) {
  var img = slot.__img;
  if (!img || img.parentNode !== slot) {
    [].slice.call(slot.querySelectorAll('.cmp-empty')).forEach(function (e) { e.remove(); });
    img = new Image(); img.decoding = 'async';
    slot.insertBefore(img, slot.firstChild); slot.__img = img;
  }
  img.alt = alt || '';
  if (img.getAttribute('src') === url) return;
  var seq = (slot.__seq = (slot.__seq || 0) + 1), pre = new Image();
  function apply() { if (seq === slot.__seq) img.src = url; }
  pre.src = url;
  if (pre.decode) pre.decode().then(apply, apply); else { pre.onload = apply; pre.onerror = apply; }
};
window.clearFrame = function (slot, html) {
  slot.__seq = (slot.__seq || 0) + 1;
  if (slot.__img) { slot.__img.remove(); slot.__img = null; }
  [].slice.call(slot.querySelectorAll('.cmp-empty')).forEach(function (e) { e.remove(); });
  slot.insertAdjacentHTML('afterbegin', html);
};
</script></head>

<script>
(function () {
  var data = JSON.parse(document.getElementById('cmp-data').textContent);
  var runs = JSON.parse(document.getElementById('cmp-runs').textContent);
  var cfg = JSON.parse(document.getElementById('cmp-cfg').textContent);
  var grid = document.getElementById('cmp-grid');
  var label = document.getElementById('cmp-time');
  var SIDES = ['a', 'b', 'c', 'd'];
  var idx = 0, timer = null, blink = false, blinkOn = false;
  function cell(s) { return grid.querySelector('[data-side="' + s + '"]'); }
  function active() { return SIDES.slice(0, +grid.dataset.cols); }
  function sel(s) { return cell(s).querySelector('select').value; }
  function shown(s) { return (blinkOn && blink && s === 'a') ? sel('b') : sel(s); }

  var warmed = {};
  function warm(i) {
    var keys = active().map(sel);
    for (var j = Math.max(0, i - 2); j <= Math.min(data.length - 1, i + 6); j++)
      keys.forEach(function (k) { var c = data[j].cells[k]; if (c && !warmed[c.img]) { warmed[c.img] = 1; new Image().src = c.img; } });
  }

  // ---- probe: the value under the pointer, read from each frame's companion .v.png
  var probes = {}, order = [];
  function probe(url, done) {
    if (probes[url]) { if (probes[url].data) done(probes[url]); else probes[url].wait.push(done); return; }
    var p = probes[url] = {wait: [done]}, im = new Image();
    order.push(url);
    if (order.length > 40) delete probes[order.shift()];
    im.onload = function () {
      var c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      var ctx = c.getContext('2d', {willReadFrequently: true}); ctx.drawImage(im, 0, 0);
      p.data = ctx.getImageData(0, 0, im.width, im.height); p.w = im.width; p.h = im.height;
      p.wait.forEach(function (f) { f(p); }); p.wait = [];
    };
    im.src = url;
  }
  function deg3(d) { return ('00' + Math.round(d)).slice(-3) + '°'; }
  function describe(run, px) {
    var r = px[0], g = px[1], b = px[2], dir = b < 255 ? ' from ' + deg3(b * 2) : '';
    if (run.probe.enc === 'pct') return 'Chance ' + r + '%' + (g < 255 ? ' · mean ' + g + ' kt' : '') + dir;
    if (run.probe.enc === 'kt10') return 'Spread ± ' + (r / 10).toFixed(1) + ' kt' + (g < 255 ? ' · mean ' + g + ' kt' : '') + dir;
    var isGust = run.label.indexOf('gust') >= 0;
    return (isGust ? 'Gust ' : '') + r + ' kt' + dir + (g < 255 ? (isGust ? ' · wind ' : ' · gust ') + g + ' kt' : '');
  }
  function readAt(side, fx, fy) {
    var c = cell(side), key = shown(side), run = runs[key], hit = frameAt(key, idx), f = hit && hit.f;
    var tip = c.querySelector('.cmp-tip'), dot = c.querySelector('.cmp-dot');
    if (!run || !f || !run.probe) { tip.hidden = true; dot.hidden = true; return; }
    var ax = run.probe.axes, bx = run.probe.box;
    var ux = (fx - ax[0]) / (ax[2] - ax[0]), uy = (fy - ax[1]) / (ax[3] - ax[1]);
    if (ux < 0 || ux > 1 || uy < 0 || uy > 1) { tip.hidden = true; dot.hidden = true; return; }
    var lon = bx[0] + ux * (bx[1] - bx[0]), lat = bx[3] - uy * (bx[3] - bx[2]);
    probe(f.v, function (p) {
      var i = Math.min(p.w - 1, Math.floor(ux * p.w)), j = Math.min(p.h - 1, Math.floor(uy * p.h));
      var k = (j * p.w + i) * 4, px = p.data.data;
      var text = px[k + 3] ? describe(run, [px[k], px[k + 1], px[k + 2]]) : 'land or no data';
      tip.textContent = text + '  (' + lat.toFixed(2) + '°N ' + (-lon).toFixed(2) + '°W)';
      var slot = c.querySelector('.cmp-slot'), img = slot.querySelector('img'), sr = slot.getBoundingClientRect(), ir = img.getBoundingClientRect();
      var x = ir.left - sr.left + fx * ir.width, y = ir.top - sr.top + fy * ir.height;
      tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.hidden = false;
      tip.style.transform = x > sr.width * 0.6 ? 'translate(calc(-100% - 10px),-110%)' : 'translate(10px,-110%)';
      dot.style.left = x + 'px'; dot.style.top = y + 'px'; dot.hidden = false;
      c.__probe = [fx, fy];
    });
  }
  function wireProbe(side) {
    var slot = cell(side).querySelector('.cmp-slot');
    function at(ev) {
      var img = slot.querySelector('img'); if (!img) return;
      var r = img.getBoundingClientRect(); if (!r.width) return;
      readAt(side, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
    }
    slot.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'mouse') at(ev); });
    slot.addEventListener('pointerdown', at);
    slot.addEventListener('pointerleave', function (ev) {
      if (ev.pointerType !== 'mouse') return;
      cell(side).querySelector('.cmp-tip').hidden = true; cell(side).querySelector('.cmp-dot').hidden = true; cell(side).__probe = null;
    });
  }

  // A product sampled every 3 h has no frame at the hours between: use the nearest within 2 h
  function frameAt(key, i) {
    if (data[i].cells[key]) return {f: data[i].cells[key], i: i};
    for (var d = 1; d <= 2; d++) {
      if (i - d >= 0 && data[i - d].cells[key]) return {f: data[i - d].cells[key], i: i - d};
      if (i + d < data.length && data[i + d].cells[key]) return {f: data[i + d].cells[key], i: i + d};
    }
    return null;
  }
  function paint(side) {
    var c = cell(side), key = shown(side), slot = c.querySelector('.cmp-slot'), run = runs[key] || {};
    var hit = frameAt(key, idx), f = hit && hit.f, badge = c.querySelector('.cmp-badge');
    if (f) paintFrame(slot, f.img, key);
    else clearFrame(slot, '<div class="cmp-empty">' + (run.label || key) + ' has no frame at this hour<br><small>its run does not reach here</small></div>');
    if (hit && hit.i !== idx) { badge.textContent = 'nearest frame: ' + data[hit.i].label_local.split(' ').slice(3).join(' '); badge.hidden = false; }
    else badge.hidden = true;
    c.querySelector('.cmp-lead').textContent = (run.cycle_label ? 'run ' + run.cycle_label : '') + (f && f.lead != null ? ' · f' + ('00' + f.lead).slice(-3) : '');
    c.querySelector('.cmp-legend').src = 'maps/legend_' + (run.family || 'speed') + '.png';
    if (c.__probe) readAt(side, c.__probe[0], c.__probe[1]);
  }
  function show(i) {
    idx = Math.max(0, Math.min(data.length - 1, i));
    var row = data[idx];
    label.innerHTML = '<b>' + row.label_local + '</b> · ' + row.label_utc;
    grid.querySelectorAll('.cmp-range').forEach(function (r) { r.value = idx; });
    active().forEach(paint);
    warm(idx);
  }
  function stop() { clearInterval(timer); timer = null; grid.querySelectorAll('[data-play]').forEach(function (b) { b.textContent = '▶︎'; }); }
  function layout(n) {
    grid.dataset.cols = n;
    SIDES.forEach(function (s, k) { cell(s).hidden = k >= n; });
    document.querySelectorAll('[data-cols-btn]').forEach(function (b) { b.classList.toggle('on', +b.dataset.colsBtn === n); });
    show(idx);
  }
  grid.addEventListener('input', function (e) { if (e.target.classList.contains('cmp-range')) { stop(); show(+e.target.value); } });
  grid.addEventListener('change', function (e) { if (e.target.tagName === 'SELECT') show(idx); });
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.step) { stop(); show(idx + (+b.dataset.step)); }
    if (b.hasAttribute('data-full')) {
      var img = b.closest('.cmp-cell').querySelector('.cmp-slot img'); if (img) window.open(img.src, '_blank');
    }
    if (b.hasAttribute('data-play')) {
      if (timer) return stop();
      grid.querySelectorAll('[data-play]').forEach(function (x) { x.textContent = '⏸'; });
      timer = setInterval(function () { show((idx + 1) % data.length); }, 800);
    }
  });
  document.querySelectorAll('[data-cols-btn]').forEach(function (b) { b.onclick = function () { layout(+b.dataset.colsBtn); }; });
  var blinkBtn = document.getElementById('blink'), blinkT = null;
  blinkBtn.onclick = function () {
    blinkOn = !blinkOn; blinkBtn.classList.toggle('on', blinkOn); grid.classList.toggle('blinking', blinkOn);
    clearInterval(blinkT); blink = false;
    if (blinkOn) blinkT = setInterval(function () { blink = !blink; paint('a'); }, 700);
    paint('a');
  };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    if (e.key === 'ArrowRight') { stop(); show(idx + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { stop(); show(idx - 1); e.preventDefault(); }
  });
  SIDES.forEach(wireProbe);
  var anyRun = runs[Object.keys(runs)[0]];
  if (anyRun && anyRun.probe && anyRun.probe.aspect) grid.style.setProperty('--ar', anyRun.probe.aspect);
  // Embedded in the briefing: tell the page how tall this is, so its frame fits without scrolling
  if (cfg.embed && window.parent !== window) {
    var lastH = 0;
    var post = function () {
      // the content's own height: the document's scrollHeight is never less than the frame, so it
      // would only ever grow
      var h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height);
      if (Math.abs(h - lastH) > 2) { lastH = h; window.parent.postMessage({mapEmbedHeight: h}, '*'); }
    };
    window.addEventListener('resize', post); window.addEventListener('load', post);
    setInterval(post, 800);
  }
  // Open at the hour nearest now where every shown pane has a frame
  var start = (!cfg.embed && window.matchMedia && matchMedia('(max-width:600px)').matches) ? 1 : cfg.cols;
  grid.dataset.cols = start;
  var now = Date.now(), best = 0, gap = Infinity;
  data.forEach(function (row, i) {
    var g = Math.abs(Date.parse(row.valid_utc.replace('Z', ':00Z')) - now);
    if (g < gap && active().every(function (s) { return frameAt(sel(s), i); })) { gap = g; best = i; }
  });
  idx = best;
  layout(start);
})();
</script>
<script>
(function(){
  var btn = document.getElementById('theme-toggle'), root = document.documentElement;
  function prefs(){ try { return JSON.parse(localStorage.getItem('prefs') || '{}') || {}; } catch (e) { return {}; } }
  function isDark(){
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function label(){ if (btn) btn.textContent = isDark() ? 'Light' : 'Dark'; }
  function apply(theme){
    if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme); else root.removeAttribute('data-theme');
    label();
    window.dispatchEvent(new Event('themechange'));
  }
  if (btn) btn.addEventListener('click', function(){
    var next = isDark() ? 'light' : 'dark', p = prefs();
    p.theme = next;
    try { localStorage.setItem('prefs', JSON.stringify(p)); } catch (e) {}
    apply(next);
  });
  // another page on the site changed it (e.g. the briefing around a framed map viewer)
  window.addEventListener('storage', function(e){ if (e.key === 'prefs') apply(prefs().theme); });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onChange = function(){ if (!root.getAttribute('data-theme')) apply(null); };
    if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
  }
  label();
})();
</script>
